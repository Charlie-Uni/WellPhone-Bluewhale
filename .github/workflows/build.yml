name: Build and local checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain
      - run: python3 tools/local_evaluation.py --include-tools --output evaluation/runs/ci-local.json --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - run: python3 tools/build_touch_probe.py --sdk "$ANDROID_HOME" --output evaluation/runs/touch-probe/probe.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-debug-apk
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/overlay/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/*.apk
            evaluation/runs/ci-local.json
            evaluation/runs/touch-probe/probe.jar
